<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trace 分析</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f4;
      --card: #fff;
      --text: #1c2430;
      --muted: #5d6975;
      --line: #e2e6eb;
      --accent: #0f6f6c;
      --p0: #b42318;
      --p1: #b45309;
      --p2: #1d4e89;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font: 15px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 650;
      line-height: 1.3;
      padding-left: 10px;
      border-left: 3px solid var(--accent);
    }
    header a {
      display: inline-flex;
      align-items: center;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 6px 12px;
      background: #fff;
    }
    header a:hover { background: #f4faf9; border-color: #c5d6d4; }
    header a:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    select {
      font: inherit;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
    }
    #status { color: var(--muted); flex: 1; font-size: 13px; }
    main { flex: 1; display: flex; min-height: 0; }
    aside {
      width: 380px;
      overflow: auto;
      padding: 14px 14px 24px;
      border-right: 1px solid var(--line);
      background: var(--bg);
    }
    #viewer { flex: 1; min-width: 0; position: relative; background: #111; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    h2 { font-size: 16px; font-weight: 650; margin: 16px 0 8px; }
    .muted { color: var(--muted); }
    .side-intro {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .side-note {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .side-note summary { cursor: pointer; }
    .side-note p { margin: 4px 0 0; }
    .dir-list { display: flex; flex-direction: column; gap: 8px; }
    .dir-card {
      margin: 0;
      padding: 10px 12px 11px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
    }
    .dir-card.is-p0 { border-left: 3px solid var(--p0); }
    .dir-card.is-p1 { border-left: 3px solid var(--p1); }
    .dir-card.is-p2 { border-left: 3px solid var(--p2); }
    .dir-head { display: flex; gap: 8px; align-items: flex-start; }
    .dir-copy { min-width: 0; flex: 1; }
    .dir-proc {
      font-size: 14px;
      font-weight: 650;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .dir-dim {
      margin-top: 1px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-width: 32px;
      margin-top: 1px;
      padding: 0 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      line-height: 20px;
      color: #fff;
    }
    .badge.p0 { background: var(--p0); }
    .badge.p1 { background: var(--p1); }
    .badge.p2 { background: var(--p2); }
    .dir-conclusion {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.45;
    }
    .dir-advice {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    details.evidence { margin: 6px 0 0; }
    details.evidence summary { font-size: 12px; color: var(--muted); cursor: pointer; }
    pre {
      white-space: pre-wrap;
      margin: 6px 0 0;
      background: #f7f8fa;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 10px;
      font: 12px/1.45 ui-monospace, Consolas, monospace;
    }
    @media (max-width: 900px) {
      main { flex-direction: column; }
      aside { width: auto; max-height: 42vh; }
      #viewer { min-height: 58vh; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/">返回主页</a>
    <h1>Trace 分析</h1>
    <select id="picker" hidden></select>
    <span id="status">正在读取本次分析…</span>
  </header>
  <main>
    <aside id="side"></aside>
    <div id="viewer">
      <iframe id="perfetto" title="Perfetto" loading="eager"></iframe>
    </div>
  </main>
  <script src="/perfetto.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let traces = [];
    const session = window.PerfettoHost.createSession($("perfetto"), {
      onStatus: (text) => { $("status").textContent = text; },
      onTimings: (timings) => { window.__traceTimings = timings; },
    });

    async function start() {
      const response = await fetch("/api/traces", { cache: "no-store" });
      const data = await response.json();
      traces = data.traces || [];
      window.PerfettoHost.renderDirections($("side"), data.analysis || {});
      if (!traces.length) {
        $("status").textContent = "这次没有 trace 文件。";
        return;
      }
      const picker = $("picker");
      picker.hidden = traces.length < 2;
      picker.replaceChildren();
      for (const trace of traces) {
        const option = document.createElement("option");
        option.value = trace.id;
        option.textContent = trace.label || trace.name;
        picker.append(option);
      }
      picker.addEventListener("change", () => {
        const selected = traces.find((item) => item.id === picker.value);
        if (selected) session.load(selected, { epoch: 1 });
      });
      session.load(traces[0], { epoch: 1 });
    }

    start();
  </script>
</body>
</html>
